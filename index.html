<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纹归 · A Return to Cloth</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee9df;color:#322c27;font-family:Arial,'PingFang SC',sans-serif}main{max-width:1450px;margin:auto;padding:35px 5vw}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #c9c0b1;padding-bottom:23px}.brand{font-family:serif;font-size:25px;letter-spacing:5px}.edition{font-size:10px;letter-spacing:2px;color:#817569}.intro{display:flex;justify-content:space-between;align-items:end;margin:29px 0 20px}h1{font-family:serif;font-weight:400;font-size:40px;margin:0 0 10px;letter-spacing:4px}p{margin:0;color:#817569;font-size:12px;line-height:1.8}.counter{font-family:serif;font-style:italic;font-size:24px;color:#9a493b}.stage{position:relative;background:#e5ddcc;box-shadow:0 18px 50px #57412b12;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:2048/1197}.badge{position:absolute;left:24px;top:21px;font-size:10px;letter-spacing:3px;color:#655648;pointer-events:none}.controls{display:flex;gap:16px;align-items:center;padding:23px 0;border-bottom:1px solid #c9c0b1}button,select{background:transparent;border:1px solid #c2b6a5;border-radius:30px;padding:10px 17px;color:#46392d;cursor:pointer;font-size:12px}button:hover{background:#ded3c2}button.primary{background:#843d32;color:#fff;border-color:#843d32;min-width:87px}input{accent-color:#863e32;flex:1;min-width:40px;cursor:pointer}time{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}footer{display:flex;justify-content:space-between;padding-top:20px;font-size:11px;color:#8a7c6d;gap:15px}#status{color:#8b4938} .phases{display:flex;gap:22px}.phases span.active{color:#873e31} @media(max-width:650px){main{padding:22px 5vw}h1{font-size:30px}.edition{font-size:8px}.controls{gap:8px;flex-wrap:wrap}button,select{padding:9px 12px}.controls input{order:2;flex-basis:75%}footer{flex-direction:column}.badge{left:12px;top:12px;font-size:8px}.intro{margin:25px 0 18px}.counter{font-size:19px}}
</style><main><header><div class="brand">纹归</div><div class="edition">A RETURN TO CLOTH / 01</div></header><div class="intro"><div><h1>让纹样，回到布上。</h1><p>从一笔轮廓，到一方织物。让散落的形态，循着记忆归位。</p></div><div class="counter" id="chapter">01 / 苏醒</div></div><div class="stage" id="stage"><canvas id="canvas" width="2048" height="1197" aria-label="纹样游动并回到原布面的动画"></canvas><div class="badge" id="badge">THREADS IN MOTION</div></div><div class="controls"><button class="primary" id="play">暂停</button><button id="reset">↺ 重播</button><input id="seek" type="range" min="0" max="20" step="0.01" value="0" aria-label="动画进度"><time id="time">00.0 / 20.0</time><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select><button id="full">全屏</button></div><footer><div class="phases"><span>01 苏醒</span><span>02 游动</span><span>03 归位</span><span>04 入绣</span></div><div id="status" role="status">正在载入纹样…</div></footer></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),seek=document.querySelector('#seek'),play=document.querySelector('#play');let t=0,playing=true,last=0,ready=false;const D=20,W=2048,H=1197;
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,p)=>a+(b-a)*p;
const load=src=>new Promise((resolve,reject)=>{let i=new Image;i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
let images,photo;
// Authentic vector assets are preserved; mirrored copies reconstruct the paired corner motifs.
const motifs=[{id:8,end:[1024,420,1710,655],start:[1030,245,990,380],rot:-.12,delay:1.8},{id:7,end:[1030,750,690,725],start:[1040,770,400,583],rot:.24,delay:2.4},{id:6,end:[365,280,580,500],start:[330,370,400,345],rot:-.48,delay:0},{id:6,end:[1670,280,580,500],start:[1700,390,400,345],rot:.55,flip:true,delay:.6},{id:5,end:[405,915,560,500],start:[380,900,400,355],rot:.43,delay:1.1},{id:5,end:[1640,915,560,500],start:[1690,930,400,355],rot:-.46,flip:true,delay:1.5}];
function motif(m){const p=smooth((t-8-m.delay)/5.4),born=smooth((t-m.delay*.35)/2.1);if(!born)return;let [x,y,w,h]=m.start.map((v,i)=>mix(v,m.end[i],p));let wave=Math.sin(t*1.5+m.delay*2);x+=Math.sin(t*.8+m.delay)*65*(1-p);y+=wave*27*(1-p);ctx.save();ctx.globalAlpha=born*(1-smooth((t-16.3)/2.8));ctx.translate(x,y);ctx.rotate(m.rot*(1-p)+Math.sin(t*1.2+m.delay)*.055*(1-p));ctx.scale((m.flip?-1:1)*mix(.88,1,born),mix(.88,1,born));ctx.shadowColor='#46372830';ctx.shadowBlur=15*(1-p);ctx.shadowOffsetY=14*(1-p);const img=images[m.id-5];for(let k=0;k<48;k++){let sy=img.naturalHeight*k/48,sh=img.naturalHeight/48,dy=-h/2+h*k/48;let bend=Math.sin(k/48*Math.PI*2-t*2+m.delay)*w*.018*(1-p);ctx.drawImage(img,0,sy,img.naturalWidth,sh,bend-w/2,dy,w,h/48+.6)}ctx.restore()}
function draw(){ctx.fillStyle='#e9e0cd';ctx.fillRect(0,0,W,H); // subtle woven background
ctx.strokeStyle='#9b86610b';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<W;x+=7){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<H;y+=7){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
// Quiet curved thread trails follow the scattered motifs.
let trail=(1-smooth((t-9)/4))*smooth(t/2)*.25;ctx.save();ctx.globalAlpha=trail;ctx.strokeStyle='#a67e5b';ctx.lineWidth=1.5;ctx.setLineDash([4,12]);ctx.beginPath();ctx.ellipse(1024,650,800,370,-.1,0,Math.PI*2);ctx.stroke();ctx.restore();
const cloth=smooth((t-12.8)/4.2);ctx.save();ctx.globalAlpha=cloth*.9;ctx.fillStyle='#b43b32';ctx.fillRect(0,0,W,H);ctx.restore();motifs.forEach(motif);ctx.save();ctx.globalAlpha=smooth((t-15.8)/3.2);ctx.drawImage(photo,0,0,W,H);ctx.restore();
seek.value=t;document.querySelector('#time').textContent=t.toFixed(1).padStart(4,'0')+' / 20.0';let phase=t<4?0:t<9?1:t<16?2:3;document.querySelector('#chapter').textContent=['01 / 苏醒','02 / 游动','03 / 归位','04 / 入绣'][phase];document.querySelectorAll('.phases span').forEach((s,i)=>s.classList.toggle('active',i===phase));document.querySelector('#badge').style.opacity=1-cloth;}
function frame(now){let dt=last?Math.min((now-last)/1000,.1):0;last=now;if(ready){if(playing){t=Math.min(D,t+dt*Number(document.querySelector('#speed').value));if(t===D){playing=false;play.textContent='播放'}}draw()}requestAnimationFrame(frame)}
play.onclick=()=>{if(t>=D)t=0;playing=!playing;play.textContent=playing?'暂停':'播放'};document.querySelector('#reset').onclick=()=>{t=0;playing=true;play.textContent='暂停'};seek.oninput=()=>{t=Number(seek.value);draw()};document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.querySelector('#stage').requestFullscreen()}catch{document.querySelector('#status').textContent='当前浏览器不支持全屏'}};
Promise.all([5,6,7,8].map(i=>load('assets/motif-'+i+'.png')).concat(load('assets/textile.jpg'))).then(a=>{images=a.slice(0,4);photo=a[4];ready=true;document.querySelector('#status').textContent='原始 SVG 纹样 · 20 秒动画';if(matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;play.textContent='播放'} }).catch(()=>document.querySelector('#status').textContent='素材载入失败，请刷新重试');requestAnimationFrame(frame);
</script></html>
