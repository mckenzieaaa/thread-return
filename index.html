<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="一根线，慢慢勾勒出苗族蚕龙纹样。"><title>纹归 · 一线成纹</title><style>*{box-sizing:border-box}body{margin:0;background:#eee9df;color:#322c27;font-family:Arial,'PingFang SC',sans-serif}main{max-width:1450px;margin:auto;padding:28px 5vw}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #c9c0b1;padding-bottom:19px}.brand{font-family:serif;font-size:25px;letter-spacing:5px}.edition{font-size:10px;letter-spacing:2px;color:#817569}.intro{display:flex;justify-content:space-between;align-items:end;margin:24px 0 20px}h1{font-family:serif;font-weight:400;font-size:37px;margin:0 0 8px;letter-spacing:4px}p{margin:0;color:#817569;font-size:12px;line-height:1.8}.counter{font-family:serif;font-style:italic;font-size:22px;color:#9a493b}.stage{position:relative;background:#f5f0e6;box-shadow:0 18px 50px #57412b12;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:1008.43/635.73}.stage:fullscreen{display:flex;align-items:center;justify-content:center;background:#eee9df}.stage:fullscreen canvas{max-width:100vw;max-height:100vh;object-fit:contain;width:auto;height:100vh}.controls{display:flex;gap:14px;align-items:center;padding:20px 0;border-bottom:1px solid #c9c0b1}button,select{background:transparent;border:1px solid #c2b6a5;border-radius:30px;padding:10px 17px;color:#46392d;cursor:pointer;font-size:12px}button:hover{background:#ded3c2}button.primary{background:#843d32;color:#fff;border-color:#843d32;min-width:87px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #863e32;outline-offset:4px}input{accent-color:#863e32;flex:1;min-width:40px;cursor:pointer}time{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}footer{display:flex;justify-content:space-between;padding-top:17px;font-size:11px;color:#8a7c6d;gap:15px}#status{color:#8b4938}.loading{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;background:#f5f0e6;letter-spacing:3px}[hidden]{display:none!important}@media(max-width:650px){main{padding:20px 4vw}h1{font-size:29px}.edition{font-size:8px}.controls{gap:8px;flex-wrap:wrap}button,select{padding:9px 12px}.controls input{order:2;flex-basis:75%}footer{flex-direction:column}.intro{margin:22px 0 18px}.counter{font-size:17px}}</style></head><body><main><header><div class="brand">纹归</div><div class="edition">ONE THREAD, A THOUSAND LINES / 02</div></header><div class="intro"><div><h1>一线，成纹。</h1><p>沿着一根线的行迹，让蚕龙纹样慢慢显现。</p></div><div class="counter" id="chapter">落笔 / 0%</div></div><div class="stage" id="stage"><canvas id="canvas" width="1800" height="1135" role="img" aria-label="一根线逐渐勾勒出完整苗族蚕龙纹线稿的动画"></canvas><div class="loading" id="loading" role="status">正在穿针引线…</div></div><div class="controls"><button class="primary" id="play" disabled>播放</button><button id="reset" disabled>↺ 重播</button><input id="seek" type="range" min="0" max="50" step="0.01" value="0" aria-label="描线进度" disabled><time id="time">00.0 / 50.0</time><select id="speed" aria-label="播放速度"><option value="0.5">0.5× 慢描</option><option value="1" selected>1×</option><option value="2">2×</option></select><button id="full">全屏</button></div><footer><div>苗族蚕龙纹 · 线稿演绎 <span aria-hidden="true">／</span> <span id="status">载入中</span></div><div>勾勒轮廓 → 盘绕细纹 → 整幅成形</div></footer></main><script>
const canvas=document.querySelector('canvas'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),status=document.querySelector('#status');let t=0,playing=false,last=0,ready=false,renderScene;const D=50,DRAW=47;const clamp=x=>Math.max(0,Math.min(1,x));
function load(src){return new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}
function shader(gl,type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function makeRenderer(map,tip){const gl=canvas.getContext('webgl',{alpha:false,antialias:false,preserveDrawingBuffer:true});if(!gl)return fallback(map,tip);const vs=shader(gl,gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 uv;void main(){uv=vec2((p.x+1.)*.5,(1.-p.y)*.5);gl_Position=vec4(p,0.,1.);}');const fs=shader(gl,gl.FRAGMENT_SHADER,`precision highp float;varying vec2 uv;uniform sampler2D ink;uniform sampler2D tip;uniform float progress;uniform float started;uniform vec2 resolution;void main(){vec4 v=texture2D(ink,uv);float age=(v.r*255.*256.+v.g*255.)/65535.;float visible=step(age,progress)*started;vec2 px=uv*resolution;float grain=fract(sin(dot(floor(px),vec2(12.9898,78.233)))*43758.5453);vec3 paper=vec3(.963,.946,.906)+(grain-.5)*.012;float weave=(sin(px.x*1.9)+sin(px.y*2.2))*.0015;paper+=weave;vec3 color=mix(paper,vec3(.18,.13,.11),v.b*visible);vec4 q=texture2D(tip,vec2(min(progress,.9999),.25));vec4 z=texture2D(tip,vec2(min(progress,.9999),.75));vec2 head=vec2((q.r*255.*256.+q.g*255.)/65535.,(z.r*255.*256.+z.g*255.)/65535.);float glow=exp(-pow(length((uv-head)*resolution)/4.,2.))*started*(1.-step(.99999,progress));color=mix(color,vec3(.64,.29,.14),glow*.85);gl_FragColor=vec4(color,1.);}`);const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('WebGL link failed');gl.useProgram(program);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);[map,tip].forEach((im,i)=>{gl.activeTexture(gl.TEXTURE0+i);const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.uniform1i(gl.getUniformLocation(program,i?'tip':'ink'),i)});const progress=gl.getUniformLocation(program,'progress'),started=gl.getUniformLocation(program,'started');gl.uniform2f(gl.getUniformLocation(program,'resolution'),canvas.width,canvas.height);return p=>{gl.viewport(0,0,canvas.width,canvas.height);gl.uniform1f(progress,p);gl.uniform1f(started,p>0?1:0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}}
function fallback(map){const c=canvas.getContext('2d'),off=document.createElement('canvas');off.width=map.width;off.height=map.height;const x=off.getContext('2d',{willReadFrequently:true});x.drawImage(map,0,0);const data=x.getImageData(0,0,off.width,off.height),src=new Uint8ClampedArray(data.data);return p=>{for(let i=0;i<src.length;i+=4){let a=((src[i]*256+src[i+1])/65535<=p&&p>0)?src[i+2]/255:0;data.data[i]=246*(1-a)+46*a;data.data[i+1]=241*(1-a)+33*a;data.data[i+2]=231*(1-a)+28*a;data.data[i+3]=255}c.putImageData(data,0,0)}}
function draw(){const p=clamp((t-.7)/DRAW);renderScene(p);seek.value=t;document.querySelector('#time').textContent=t.toFixed(1).padStart(4,'0')+' / 50.0';document.querySelector('#chapter').textContent=(p===0?'落笔':p>=1?'成纹':'行线')+' / '+Math.round(p*100)+'%'}
function frame(now){const dt=last?Math.min((now-last)/1000,.1):0;last=now;if(ready&&playing){t=Math.min(D,t+dt*Number(document.querySelector('#speed').value));draw();if(t===D){playing=false;play.textContent='重播';status.textContent='整幅线稿已完成'}}requestAnimationFrame(frame)}
play.onclick=()=>{if(t>=D)t=0;playing=!playing;play.textContent=playing?'暂停':'播放';status.textContent=playing?'正在描线':'已暂停';draw()};document.querySelector('#reset').onclick=()=>{t=0;playing=true;play.textContent='暂停';status.textContent='正在描线';draw()};seek.oninput=()=>{t=Number(seek.value);draw();if(t>=D){playing=false;play.textContent='重播';status.textContent='整幅线稿已完成'}};document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.querySelector('#stage').requestFullscreen()}catch{status.textContent='当前浏览器不支持全屏'}};
Promise.all([load('assets/reveal-map.png'),load('assets/thread-tip.png')]).then(([map,tip])=>{renderScene=makeRenderer(map,tip);ready=true;document.querySelector('#loading').hidden=true;[play,seek,document.querySelector('#reset')].forEach(e=>e.disabled=false);playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;play.textContent=playing?'暂停':'播放';status.textContent=playing?'正在描线':'点击播放开始';draw()}).catch(e=>{document.querySelector('#loading').textContent='纹样载入失败，请刷新重试';status.textContent='载入失败';console.error(e)});requestAnimationFrame(frame);
</script></body></html>
