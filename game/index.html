<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee8db"><title>纹归 · 彩线行旅</title><link rel="stylesheet" href="game.css"></head><body><main><header><a href="../" class="brand">纹归 <small>彩线行旅</small></a><p class="quick-rule">① 掷彩骰　② 点亮处走一步　③ 集齐共首、龙首、卷纹三印，到终点合纹 <span>每步 −1 行动 · 金桥 −2 彩线 · 合纹留2束</span></p><button id="fullscreen">全屏</button></header><div class="layout"><section class="play-area"><div class="board-toolbar"><span id="turn"></span><div class="view-switch"><button data-view="line">线稿</button><button data-view="color">色稿</button><button data-view="cloth">原布</button></div></div><div class="board-shell"><svg id="board" viewBox="0 0 1008.43 635.73" role="group" aria-label="布面路线棋盘，掷骰后点击相邻位置，消耗一步"><defs><pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 1H6M1 0V6" stroke="#fff" stroke-opacity=".06" stroke-width=".6"/></pattern><filter id="shadow" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#40261a" flood-opacity=".35"/></filter><radialGradient id="wood"><stop stop-color="#fff8e7"/><stop offset="1" stop-color="#ddc8a2"/></radialGradient><radialGradient id="pawn-fill" cx="35%" cy="25%"><stop stop-color="#75968a"/><stop offset="1" stop-color="#244d42"/></radialGradient></defs><rect width="1008.43" height="635.73" fill="#f5f0e6"/><image id="line-view" href="pattern-line.png" width="1008.43" height="635.73" opacity=".4"/><image id="color-view" href="pattern-color.png" width="1008.43" height="635.73"/><image id="cloth-view" href="cloth.jpg" width="1008.43" height="635.73" preserveAspectRatio="xMidYMid meet"/><g id="routes"></g><g id="journey"></g><g id="nodes"></g><g id="pawn" pointer-events="none" filter="url(#shadow)"><ellipse cy="12" rx="16" ry="6" fill="#39271f" opacity=".18"/><path d="M-11 8Q-13-2-6-10Q-14-25 0-28Q14-25 6-10Q13-2 11 8Q0 15-11 8Z" fill="url(#pawn-fill)" stroke="#fff5dc" stroke-width="2.3"/><path d="M-5-20Q-7-24-2-25" fill="none" stroke="#d0e2cc" stroke-width="2" stroke-linecap="round"/></g></svg></div><div class="action-row"><button id="undo">↶ 撤回</button><button id="hint">提示</button><button id="restart">重来</button><span id="message" role="status" aria-live="polite">掷一次彩骰，开始沿纹样走线。</span></div></section><aside><section class="dice-card"><div class="card-label">十二色彩骰 <span id="dice-status">待投掷</span></div><button id="roll" aria-label="投掷十二面彩色骰子"><svg id="die" viewBox="0 0 140 140" aria-hidden="true"><g stroke="#fff5df" stroke-width="2"><path fill="var(--thread)" d="M70 6 124 37 124 101 70 133 16 101 16 37Z"/><path fill="#ffffff30" d="M70 6 70 32 34 58 16 37Z"/><path fill="#00000018" d="M124 37 106 58 106 91 124 101Z"/><path fill="#ffffff20" d="M70 6 124 37 106 58 70 32Z"/><path fill="#00000028" d="M70 133 70 111 106 91 124 101Z"/><path fill="#00000015" d="M16 101 34 91 70 111 70 133Z"/><path fill="#ffffff18" d="M16 37 34 58 34 91 16 101Z"/><path fill="none" d="M70 32 106 58 94 96 46 96 34 58Z"/></g><text x="70" y="79" text-anchor="middle" fill="#fff8e5" font-size="20" font-family="serif">线</text></svg><span id="roll-label">掷彩骰</span></button><div id="palette" aria-label="十二种骰面颜色"></div><p id="color-name">骰色决定这一针与补给线团的颜色</p></section><section class="resources"><div class="resource-title">行动 <strong id="steps-label"></strong></div><div id="step-tokens"></div><div class="resource-title yarn-title">彩线 <strong id="buttons-label"></strong></div><div id="button-tokens"></div></section><section class="mission"><div class="seals"><div id="seal-left" class="seal"><span>共</span><small>共首</small></div><div id="seal-flower" class="seal"><span>首</span><small>龙首</small></div><div id="seal-right" class="seal"><span>卷</span><small>卷纹</small></div></div><div id="exit-check"></div></section></aside></div><div class="portrait-note">↻ 横过手机，展开整片纹样</div></main><dialog id="result"><div class="result-icon">✦</div><h2 id="result-title"></h2><p id="result-detail"></p><div id="result-stars"></div><div class="dialog-actions"><button id="result-back">回看色稿</button><button id="result-cloth">查看原布</button><button id="result-restart">再走一次</button></div></dialog><script src="map-data.js"></script><script src="rules.js"></script><script src="game.js"></script></body></html>
